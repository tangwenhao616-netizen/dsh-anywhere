#         sshArgs: ['-i','~/.ssh/id_rsa','-o','IdentitiesOnly=yes','-o','BatchMode=yes']
#         cwd: 'C:\Users\you\work'
#         platform: 'windows'                # ← 关键:走 PowerShell 后端
