# dsh-ssh-world 合成补丁(参考;E2B 同款)。把一个 dsh 实例的执行世界整体搬到远程机器:
# 禁本地 fs/subprocess provider、插 dsh-ssh-world(一个插件同时注册 ctx.fs + ctx.subprocess,
# 共享一条 ControlMaster 连接)、sandbox 放行、cwd/workspaceRoot 统一(一世界不变式)。
# bash/grep/终端/LSP 自动落远程。
#
# 用法:
#   1) 装插件:dsh plugin --profile <你的profile> add dsh-ssh-world
#      (或 npm i / link 到该 profile;peerDeps @deepseek-ai/dsh-fs、dsh-subprocess 由 dsh 提供)
#   2) 从"远程 cwd 对应的本地占位目录"启动,并放行审批:
#      DSH_PERMISSION_MODE=danger-full-access \
#        dsh --profile <你的profile> --patch ./ssh-world.patch.yml "任务"
#      (会话 cwd 须与下面的 cwd / workspaceRoot 同指一个远程目录)
#
# 已验证:agent 的 read/write/edit + bash + grep 全部落在远程机器(真机端到端)。
# 接 fleet 入网机器:把 sshArgs 换成该机器的连法(含 -o ProxyJump=<relay-login> 经中继)。

- id: fs-sandbox
  disabled: true
- id: subprocess
  disabled: true
- id: sandbox-policy
  config:
    mode: danger-full-access
    workspaceRoot: /remote/workspace      # = 下面的 cwd
- insert:
    - id: ssh-world
      name: dsh-ssh-world
      config:
        login: 'user@fleet-machine'
        sshArgs:
          - '-i'
          - '~/.ssh/id_rsa'
          - '-o'
          - 'IdentitiesOnly=yes'
          - '-o'
          - 'BatchMode=yes'
          - '-o'
          - 'ProxyJump=ubuntu@YOUR_RELAY'  # 经中继够到 fleet 入网机器;直连机器则删这两行
        cwd: '/remote/workspace'
